project:
  type: website
  output-dir: _site
  execute-dir: project

website:
  title: "Descriptive Statistics"
  description: "Summarising, displaying and exploring data"
  search: true
  page-navigation: true
  navbar:
    left:
      - text: "Home"
        href: index.qmd
  sidebar:
    - title: "Topics"
      style: docked
      contents:
        - section: "Topic 1. Introduction"
          contents:
            - topics/01-introduction/01-stats-population-samples.ipynb
            - topics/01-introduction/02-types-of-variables.ipynb
        - section: "Topic 2. Univariate data"
          contents:
            - topics/02-univariate/01-freq-graphs.ipynb
            - topics/02-univariate/02-centre-position.ipynb
            - topics/02-univariate/03-dispersion-shape.ipynb
            - topics/02-univariate/04-exercises.ipynb
        - topics/03-bivariate.qmd

lang: en
bibliography: references.bib

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    number-sections: false
    code-copy: true
    fig-align: center
    link-citations: true

execute:
  enabled: true      # run notebooks on render (outputs saved in the .ipynb are ignored)
  echo: true
  warning: false
  freeze: auto

jupyter: python3
